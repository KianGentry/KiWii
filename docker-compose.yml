services:
  mkwii-server:
    build: .
    environment:
      MKWII_SERVER_NAME: ${MKWII_SERVER_NAME:?set MKWII_SERVER_NAME in .env}
      MKWII_ADVERTISED_ADDRESS: ${MKWII_ADVERTISED_ADDRESS:?set MKWII_ADVERTISED_ADDRESS in .env}
      MKWII_HEALTH_PORT: ${MKWII_HEALTH_PORT:-8080}
      MKWII_DNS_PORT: ${MKWII_DNS_PORT:-5353}
      MKWII_NAS_PORT: ${MKWII_NAS_PORT:-80}
      MKWII_QR_PORT: ${MKWII_QR_PORT:-27900}
      MKWII_PROFILE_PORT: ${MKWII_PROFILE_PORT:-29900}
      MKWII_GAME_PORT: ${MKWII_GAME_PORT:-28910}
      MKWII_GAMESPY_SECRET_KEY: ${MKWII_GAMESPY_SECRET_KEY:-9r3Rmy}
    ports:
      - "${MKWII_HEALTH_PORT:-8080}:${MKWII_HEALTH_PORT:-8080}/tcp"
      - "${MKWII_DNS_PORT:-5353}:${MKWII_DNS_PORT:-5353}/udp"
      - "${MKWII_NAS_PORT:-80}:${MKWII_NAS_PORT:-80}/tcp"
      - "${MKWII_QR_PORT:-27900}:${MKWII_QR_PORT:-27900}/udp"
      - "${MKWII_PROFILE_PORT:-29900}:${MKWII_PROFILE_PORT:-29900}/tcp"
      - "${MKWII_GAME_PORT:-28910}:${MKWII_GAME_PORT:-28910}/tcp"
      - "${MKWII_GAME_PORT:-28910}:${MKWII_GAME_PORT:-28910}/udp"
    restart: unless-stopped
